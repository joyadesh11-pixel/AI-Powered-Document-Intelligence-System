services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dociq
      POSTGRES_USER: dociq
      POSTGRES_PASSWORD: dociq
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
